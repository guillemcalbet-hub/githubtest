<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FESTO MPS · Documentació tècnica</title>
<style>
:root{--bg:#0b0d10;--s1:#14171c;--s2:#1b1f26;--linia:rgba(255,255,255,.09);--tx:#f2f4f7;--tx2:#9aa3af;--ac:#2bb8ff;--ok:#5be3a1;--warn:#f5b849;--r:26px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--tx);font:16px/1.45 -apple-system,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;background:radial-gradient(900px 420px at 50% -120px,rgba(43,184,255,.16),transparent 70%),var(--bg)}
#app{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
button,a{font:inherit;color:inherit;text-decoration:none}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:14px}
.vista{animation:entra .38s var(--ease) both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.escala{animation:entra .5s var(--ease) both;animation-delay:calc(var(--i,0)*80ms)}
.press{transition:transform .18s var(--ease),background .2s}
.press:active{transform:scale(.97)}

/* Capçalera principal */
.xips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.xip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:.8rem;color:var(--tx2);background:rgba(255,255,255,.06);border:1px solid var(--linia);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.punt{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(91,227,161,.18)}
h1{margin:0;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;font-weight:800;letter-spacing:-.03em}
h1 span{color:var(--ac)}
.sub{margin:8px 0 22px;color:var(--tx2);font-size:1.05rem}

/* Targetes d'estació */
.llista{display:grid;gap:16px}
@media(min-width:760px){#app{max-width:980px}.llista{grid-template-columns:repeat(3,1fr)}}
.est{display:block;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--linia);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.escena{position:relative;aspect-ratio:16/11;background:radial-gradient(circle at 50% 40%,#fff,#dfe5ec);display:grid;place-items:center}
.escena img{width:92%;height:92%;object-fit:contain;mix-blend-mode:multiply}
.escena .num{position:absolute;left:14px;top:12px;padding:3px 10px;border-radius:99px;background:rgba(11,13,16,.78);color:#fff;font-size:.78rem;font-weight:600}
.cos-est{display:flex;align-items:center;gap:12px;padding:16px 18px 18px}
.cos-est h2{margin:0 0 3px;font-size:1.3rem;letter-spacing:-.01em}
.cos-est p{margin:0;color:var(--tx2);font-size:.92rem}
.fletxa{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(43,184,255,.14);color:var(--ac)}
.est:active .fletxa{background:var(--ac);color:#06202e}
svg{display:block}
.peu{margin:26px 0 0;text-align:center;color:var(--tx2);font-size:.82rem}

/* Barra superior */
.barra{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 0;margin-bottom:6px;background:linear-gradient(var(--bg) 60%,transparent)}
.enrere{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid var(--linia);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.barra .t{font-weight:600;color:var(--tx2)}

/* Pantalla d'estació */
.heroi{border-radius:var(--r);overflow:hidden;border:1px solid var(--linia);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.heroi .escena{aspect-ratio:4/3}
.cred{margin:6px 4px 0;font-size:.72rem;color:var(--tx2);text-align:right}
h2.titol{margin:16px 0 4px;font-size:1.7rem;letter-spacing:-.02em;line-height:1.15}
.desc{margin:0 0 20px;color:var(--tx2)}
.ops{display:grid;gap:12px}
@media(min-width:560px){.ops{grid-template-columns:1fr 1fr}}
.op{display:flex;align-items:center;gap:14px;min-height:76px;padding:14px 16px;border-radius:22px;background:var(--s1);border:1px solid var(--linia)}
.op:hover{background:var(--s2)}
.ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(43,184,255,.13);color:var(--ac)}
.op:active .ic svg{transform:scale(1.12) rotate(-4deg)}
.ic svg{transition:transform .25s var(--ease)}
.op .m{flex:1;min-width:0}
.op b{display:block;font-size:1.05rem}
.op small{color:var(--tx2);font-size:.82rem}
.op .fi{color:var(--tx2)}

/* Taula E/S */
.tabs{display:flex;padding:4px;gap:4px;margin:0 0 14px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--linia)}
.tabs a{flex:1;text-align:center;padding:10px;border-radius:99px;font-weight:600;color:var(--tx2);transition:background .25s,color .25s}
.tabs a.on{background:var(--ac);color:#06202e}
.eines{display:grid;gap:10px;margin-bottom:14px}
#cerca{width:100%;height:46px;border-radius:14px;border:1px solid var(--linia);background:var(--s1);color:var(--tx);padding:0 16px;font:inherit}
.fil{display:flex;gap:8px}
.fil button{flex:1;min-height:42px;border-radius:99px;border:1px solid var(--linia);color:var(--tx2);background:var(--s1);font-weight:600;transition:all .2s}
.fil button.on{background:rgba(43,184,255,.16);color:var(--ac);border-color:rgba(43,184,255,.4)}
.llegenda{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 12px;font-size:.8rem;color:var(--tx2);align-items:center}
.llegenda i{display:inline-block;width:22px;height:9px;border-radius:9px;margin-right:6px;vertical-align:0}
.nota{margin:0 0 14px;padding:12px 14px;border-radius:16px;font-size:.84rem;color:var(--tx2);background:rgba(255,255,255,.04);border:1px solid var(--linia)}
.grup{margin-bottom:14px;background:var(--s1);border:1px solid var(--linia);border-radius:22px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.cap{width:100%;display:flex;align-items:center;gap:10px;padding:16px 18px;font-weight:700;font-size:1.05rem;text-align:left;min-height:56px}
.cap .cnt{margin-left:auto;font-weight:500;font-size:.8rem;color:var(--tx2)}
.cap svg{transition:transform .3s var(--ease);color:var(--tx2)}
.grup.tancat .cap svg{transform:rotate(-90deg)}
.cos,.fitxa{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s var(--ease)}
.grup.tancat .cos{grid-template-rows:0fr}
.int{overflow:hidden;min-height:0}
.fila{border-top:1px solid var(--linia)}
.fb{position:relative;width:100%;display:grid;grid-template-columns:50px 1fr 40px 18px;gap:12px;align-items:center;padding:12px 16px 12px 0;text-align:left;min-height:64px}
.banda{position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:0 5px 5px 0;background:var(--gv)}
.fb .adr{margin-left:16px}
.adr{font-weight:700;font-variant-numeric:tabular-nums;padding:3px 0;text-align:center;border-radius:10px;font-size:.95rem}
.ent .adr{color:var(--ac);background:rgba(43,184,255,.12)}
.sor .adr{color:var(--ok);background:rgba(91,227,161,.12)}
.tx .d{display:block;font-weight:500}
.tx small{color:var(--tx2);font-size:.78rem}
.pil{display:block;width:40px;height:12px;border-radius:99px;background:var(--g);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 0 10px -2px var(--g);filter:saturate(.85)}
.pil.gran{width:100%;max-width:150px;height:16px}
.fb>svg{transition:transform .3s var(--ease);color:var(--tx2)}
.fila.obert .fb>svg{transform:rotate(180deg)}
.fitxa{grid-template-rows:0fr}
.fila.obert .fitxa{grid-template-rows:1fr}
.fitxa .int{padding:0 14px}
.card{margin:2px 0 14px;padding:14px;border-radius:18px;background:var(--s2);border:1px solid var(--linia);display:grid;gap:10px}
.card>div{display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:.9rem}
.card>div>span:first-child{color:var(--tx2);flex:none}
.card>div>:last-child{text-align:right}
.card .btn{justify-content:center;margin:2px 0 0;min-height:44px;font-size:.9rem}
.pen{color:var(--warn)}
.fila.pend .d{color:var(--warn)}
.cercles{padding:30px 20px;text-align:center;color:var(--tx2)}

/* Connexions */
.sigs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.sig{flex:none;min-width:58px;height:46px;padding:0 12px;border-radius:14px;border:1px solid var(--linia);background:var(--s1);font-weight:700;position:relative;overflow:hidden;scroll-snap-align:start;transition:border-color .2s,box-shadow .2s}
.sig::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--g)}
.sig.on{border-color:var(--ac);box-shadow:0 0 0 3px rgba(43,184,255,.2)}
.sim{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 14px;border-radius:16px;background:var(--s1);border:1px solid var(--linia);font-size:.84rem;color:var(--tx2)}
.sim.on{border-color:rgba(245,184,73,.5);background:rgba(245,184,73,.08);color:var(--warn)}
.sw{flex:none;position:relative;width:50px;height:30px;border-radius:99px;background:#3a414b;transition:background .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw.on{background:var(--ac)}.sw.on::after{transform:translateX(20px)}
.node{padding:14px 16px;border-radius:20px;background:var(--s1);border:1px solid var(--linia);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.node h4{margin:0 0 6px;font-size:.78rem;font-weight:600;color:var(--tx2)}
.node p{margin:0}
.node.sel{border-color:rgba(43,184,255,.55);box-shadow:0 0 0 3px rgba(43,184,255,.1)}
.node.pend{border-style:dashed;color:var(--warn)}
.node .l{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-top:6px}
.est-v{font-weight:700;padding:2px 10px;border-radius:99px;font-size:.8rem;background:rgba(255,255,255,.08)}
.est-v.u{background:rgba(91,227,161,.18);color:var(--ok)}
.lin{height:34px;width:2px;margin:0 auto;background:repeating-linear-gradient(180deg,var(--ac) 0 6px,transparent 6px 12px);background-size:2px 12px;animation:flux .8s linear infinite;opacity:.7}
.lin.off{animation:none;opacity:.22}
@keyframes flux{to{background-position:0 12px}}
.cap-home{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.logo{flex:none;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 6px 16px rgba(0,0,0,.4);margin-top:4px}
.logo img{display:block;height:38px;width:auto}
.logo.buit-logo{display:grid;place-items:center;height:50px;width:100px;font-size:.7rem;color:#666;text-align:center}

/* Grafcet */
.buit{margin-top:20px;padding:44px 24px;text-align:center;border-radius:var(--r);background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--linia)}
.buit .ic{width:72px;height:72px;border-radius:22px;margin:0 auto 18px}
.buit .ic svg{width:36px;height:36px}
.buit h3{margin:0;font-size:1.5rem}
.buit .pr{display:inline-block;margin:10px 0 8px;padding:4px 14px;border-radius:99px;background:rgba(245,184,73,.14);color:var(--warn);font-weight:600}
.buit p{margin:0 auto;max-width:34ch;color:var(--tx2)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;min-height:48px;padding:0 22px;border-radius:99px;background:var(--ac);color:#06202e;font-weight:700}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* =====================  PANTALLES  ===================== */
const app = document.getElementById("app");

function barra(enrere, titol) {
  const b = enrere ? `<a class="enrere press" href="${enrere}" aria-label="Tornar enrere">${ico("enrere")}</a>` : "";
  return `<div class="barra">${b}<span class="t">${esc(titol)}</span></div>`;
}
function escena(e, num) {
  return `<div class="escena"><img src="${e.img}" alt="Fotografia de l’estació ${esc(e.nom)}">${num ? `<span class="num">Estació ${e.num}</span>` : ""}</div>`;
}

function inici() {
  return `<div class="vista">
    <div class="cap-home"><div><h1>FESTO <span>MPS</span></h1><p class="sub" style="margin-bottom:12px">Documentació tècnica del laboratori</p>
      <div class="xips" style="margin:0 0 20px"><span class="xip">Mecatrònica Industrial</span><span class="xip"><i class="punt"></i>Eina de consulta</span></div></div>
      ${LOGO ? `<div class="logo"><img src="${LOGO}" alt="Institut Escola del Treball de Barcelona" width="93" height="38"></div>` : `<div class="logo buit-logo">Logo del centre (pendent)</div>`}</div>
    <div class="llista">${ESTACIONS.map((e, i) => `
      <a class="est press escala" style="--i:${i + 1}" href="#${e.id}" aria-label="Obrir ${esc(e.nom)}">
        ${escena(e, true)}
        <div class="cos-est"><div style="flex:1"><h2>${esc(e.curt)}</h2><p>${esc(e.curta)}</p></div><span class="fletxa">${ico("dreta")}</span></div>
      </a>`).join("")}</div>
    <p class="peu">${esc(LABORATORI)}</p></div>`;
}

function op(ico_, titol, text, href, extern, h) {
  return `<a class="op press escala" style="--i:${h}" href="${esc(href)}"${extern ? ' target="_blank" rel="noopener"' : ""}>
    <span class="ic">${ico(ico_)}</span><span class="m"><b>${titol}</b><small>${text}</small></span>
    <span class="fi">${ico(extern ? "fora" : "dreta", 20)}</span></a>`;
}

function estacio(e) {
  const fix = ESTACIO_FIXA === e.id;
  return `<div class="vista">${barra(fix ? "" : "#", fix ? "Estació " + e.num : "Totes les estacions")}
    <div class="heroi">${escena(e, false)}</div><p class="cred">Imatge: Festo Didactic</p>
    <h2 class="titol">${esc(e.nom)}</h2><p class="desc">${esc(e.desc)}</p>
    <div class="ops">
      ${op("esquemes", "Esquemes", "Plànols elèctrics i pneumàtics (PDF)", e.esquemes, true, 1)}
      ${op("es", "Entrades / Sortides PLC", "Taula d’assignació en català", "#" + e.id + "/es", false, 2)}
      ${e.grafcet ? op("grafcet", "Grafcet", "Document del professorat", e.grafcet, true, 3) : op("grafcet", "Grafcet", "Properament", "#" + e.id + "/grafcet", false, 3)}
      ${op("components", "Components", "Elements de l’estació a Festo", e.components, true, 4)}
    </div></div>`;
}

function cable(r) {
  const [pin, nom] = r[1].split(" · "), cs = nom.split("-").map(x => COL[x] || "#777");
  const f = a => cs.length > 1 ? `linear-gradient(${a},${cs[0]},${cs[1]})` : `linear-gradient(${a},${cs[0]},color-mix(in srgb,${cs[0]} 65%,#000))`;
  return { pin, nom, g: f("90deg"), gv: f("180deg") };
}
const tabs = (e, v) => `<nav class="tabs"><a class="${v === "es" ? "on" : ""}" href="#${e.id}/es">Taula E/S</a><a class="${v === "con" ? "on" : ""}" href="#${e.id}/connexions">Connexions</a></nav>`;

function fila(e, r) {
  const c = cable(r), pend = r[2] === "Sense assignar", cls = r[3] === "Entrada" ? "ent" : "sor", ob = obert.has(e.id + r[0]);
  return `<div class="fila ${cls}${pend ? " pend" : ""}${ob ? " obert" : ""}" style="--g:${c.g};--gv:${c.gv}">
    <button class="fb" data-a="${r[0]}" aria-expanded="${ob}"><span class="banda"></span><span class="adr">${r[0]}</span>
      <span class="tx"><span class="d">${esc(r[2])}</span><small>${esc(r[3])} · cable ${esc(c.nom)}</small></span><span class="pil"></span>${ico("baix", 18)}</button>
    <div class="fitxa"><div class="int"><div class="card">
      <div><span>Adreça</span><b>${r[0]}</b></div><div><span>Descripció</span><span>${esc(r[2])}</span></div><div><span>Tipus</span><span>${esc(r[3])}</span></div>
      <div><span>Cable SysLink</span><span style="display:flex;gap:10px;align-items:center;justify-content:flex-end;flex:1"><span class="pil gran"></span>${esc(c.nom)} · pin ${c.pin}</span></div>
      <div><span>Símbol</span><span class="pen">No documentat a la taula</span></div>
      <div><span>Component físic</span><span class="pen">Pendent de verificar</span></div>
      <button class="btn" data-con="${r[0]}">Veure a Connexions</button></div></div></div></div>`;
}
function grup(id, titol, rows, cls) {
  if (!rows.length) return "";
  const tc = tancats.has(cls);
  return `<section class="grup ${cls}${tc ? " tancat" : ""}"><button class="cap" data-g="${cls}" aria-expanded="${!tc}">${titol}<span class="cnt">${rows.length} senyals</span>${ico("baix", 20)}</button>
    <div class="cos"><div class="int">${rows.map(r => fila(cur, r)).join("")}</div></div></section>`;
}
function llista(e) {
  const q = estat.q.trim().toLowerCase();
  const ok = r => (estat.t === "tot" || r[3] === estat.t) && (!q || (r[0] + " " + r[2]).toLowerCase().includes(q));
  const html = grup(e.id, "Entrades · I0–I7", e.es.filter(r => r[3] === "Entrada" && ok(r)), "ent") + grup(e.id, "Sortides · Q0–Q7", e.es.filter(r => r[3] === "Sortida" && ok(r)), "sor");
  return html || '<p class="cercles">Cap senyal coincideix amb la cerca.</p>';
}
function entrades(e) {
  const f = (v, t) => `<button class="${estat.t === v ? "on" : ""}" data-t="${v}">${t}</button>`;
  return `<div class="vista">${barra("#" + e.id, e.curt)}${tabs(e, "es")}
    <div class="eines"><input id="cerca" type="search" placeholder="Cerca per adreça o nom (ex. I4, cinta)" value="${esc(estat.q)}" aria-label="Cerca de senyals">
      <div class="fil">${f("tot", "Totes")}${f("Entrada", "Entrades")}${f("Sortida", "Sortides")}</div></div>
    <div class="llegenda"><span><i style="background:linear-gradient(90deg,#9aa3ad,#f0a3c3)"></i>Colors del cable SysLink</span><span style="color:var(--warn)">▍Sense assignar / pendent</span></div>
    <p class="nota">Els colors identifiquen el cable SysLink de cada senyal. No són símbols elèctrics. Toqueu una fila per veure’n la fitxa.</p>
    <div id="llista">${llista(e)}</div></div>`;
}

const val = (e, a) => !!estat.val[e.id + a];
const calc = (e, x) => { const f = x.ent.map(a => (x.neg || []).includes(a) ? !val(e, a) : val(e, a)); return x.op === "OR" ? f.some(Boolean) : f.every(Boolean); };
function connexions(e) {
  const sel = estat.sel[e.id] || e.es[0][0], s = e.es.find(r => r[0] === sel), c = cable(s), ent = s[3] === "Entrada";
  const rels = (RELACIONS[e.id] || []).filter(x => x.sor === sel || x.ent.includes(sel));
  const tit = a => { const r = e.es.find(x => x[0] === a); return `${a} · ${esc(r[2])}`; };
  const sw = a => estat.sim ? `<button class="sw ${val(e, a) ? "on" : ""}" data-sim="${a}" role="switch" aria-checked="${val(e, a)}" aria-label="Estat simulat de ${a}"></button>` : "";
  const pend = '<p class="pen">Relació pendent de verificar</p>';
  const nodeSel = `<div class="node sel" style="--g:${c.g}"><h4>${ent ? "Entrada" : "Sortida"} seleccionada</h4><b>${tit(sel)}</b>
    <div class="l"><span class="pil gran"></span>${ent ? sw(sel) : (estat.sim ? `<span class="est-v">simulat</span>` : "")}</div></div>`;
  const llistaR = (f) => rels.map(x => f(x)).join("");
  const nEnt = !rels.length ? `<div class="node pend"><h4>Entrades que hi intervenen</h4>${pend}</div>` :
    `<div class="node"><h4>Entrades que hi intervenen</h4>${llistaR(x => x.ent.map(a => `<p>${tit(a)}</p>`).join(""))}</div>`;
  const nLog = `<div class="node ${rels.length ? "" : "pend"}"><h4>Lògica del PLC</h4>${rels.length ? llistaR(x => `<p>${x.sor} = ${x.ent.map(a => ((x.neg || []).includes(a) ? "NO " : "") + a).join(x.op === "OR" ? " O " : " I ")} <small style="color:var(--tx2)">(${esc(x.font)})</small></p>`) : "<p>Grafcet / programa del PLC no disponible</p>" + pend}</div>`;
  const nSor = !rels.length ? `<div class="node pend"><h4>Sortides relacionades</h4>${pend}</div>` :
    `<div class="node"><h4>Sortides relacionades</h4>${llistaR(x => `<div class="l"><span>${tit(x.sor)}</span>${estat.sim ? `<span class="est-v ${calc(e, x) ? "u" : ""}">${calc(e, x) ? "ON" : "OFF"} (simulat)</span>` : ""}</div>`)}</div>`;
  const lin = `<div class="lin ${estat.sim && ent && val(e, sel) ? "" : "off"}"></div>`;
  const diag = ent ? nodeSel + lin + nLog + lin + nSor : nEnt + lin + nLog + lin + nodeSel;
  return `<div class="vista">${barra("#" + e.id, e.curt)}${tabs(e, "con")}
    <h2 class="titol" style="font-size:1.4rem">Mapa de senyals</h2><p class="desc">Trieu un senyal per veure’n el camí: entrada → PLC → sortida.</p>
    <div class="sim ${estat.sim ? "on" : ""}"><button class="sw ${estat.sim ? "on" : ""}" data-simmode role="switch" aria-checked="${estat.sim}" aria-label="Mode simulació"></button>
      <span>${estat.sim ? "<b>Simulació activa.</b> Valors fictiu: no es llegeix el PLC ni es controla l’estació física." : "Mode simulació desactivat. L’app no té connexió amb el PLC."}</span></div>
    <div class="sigs">${e.es.map(r => `<button class="sig ${r[0] === sel ? "on" : ""}" data-sel="${r[0]}" style="--g:${cable(r).g}">${r[0]}</button>`).join("")}</div>
    <div id="diag">${diag}</div></div>`;
}
function grafcet(e) {
  return `<div class="vista">${barra("#" + e.id, e.curt)}
    <div class="buit"><span class="ic">${ico("grafcet", 36)}</span><h3>Grafcet</h3><span class="pr">Properament</span>
    <p>El document estarà disponible quan el professorat comparteixi l’enllaç.</p></div></div>`;
}

/* =====================  RUTES  ===================== */
function ruta() {
  try {
    let h = location.hash.replace("#", "");
    if (!h) h = ESTACIO_FIXA || new URLSearchParams(location.search).get("estacio") || "";
    const [id, sub] = h.split("/");
    const e = ESTACIONS.find(x => x.id === id);
    cur = e || null;
    app.innerHTML = !e ? inici() : sub === "es" ? entrades(e) : sub === "connexions" ? connexions(e) : sub === "grafcet" ? grafcet(e) : estacio(e);
    window.scrollTo(0, 0);
  } catch (err) {
    app.innerHTML = '<p class="nota">No s’ha pogut carregar l’aplicació. Torneu-ho a provar.</p>';
    console.error(err);
  }
}
const repinta = () => { const e = cur, h = location.hash.split("/")[1]; if (!e) return;
  const y = window.scrollY; app.innerHTML = h === "connexions" ? connexions(e) : entrades(e); app.firstElementChild.style.animation = "none"; window.scrollTo(0, y); };
app.addEventListener("click", ev => {
  const q = s => ev.target.closest(s);
  let b;
  if ((b = q("[data-con]"))) { estat.sel[cur.id] = b.dataset.con; location.hash = "#" + cur.id + "/connexions"; }
  else if ((b = q(".fb"))) { const k = cur.id + b.dataset.a, f = b.parentElement; f.classList.toggle("obert") ? obert.add(k) : obert.delete(k); b.setAttribute("aria-expanded", obert.has(k)); }
  else if ((b = q(".cap"))) { const g = b.parentElement, c = g.classList.toggle("tancat"); c ? tancats.add(b.dataset.g) : tancats.delete(b.dataset.g); b.setAttribute("aria-expanded", String(!c)); }
  else if ((b = q("[data-t]"))) { estat.t = b.dataset.t; repinta(); }
  else if ((b = q("[data-sel]"))) { estat.sel[cur.id] = b.dataset.sel; repinta(); }
  else if ((b = q("[data-sim]"))) { const k = cur.id + b.dataset.sim; estat.val[k] = !estat.val[k]; repinta(); }
  else if (q("[data-simmode]")) { estat.sim = !estat.sim; repinta(); }
});
app.addEventListener("input", ev => { if (ev.target.id === "cerca") { estat.q = ev.target.value; document.getElementById("llista").innerHTML = llista(cur); } });
window.addEventListener("hashchange", ruta);
ruta();
</script>
</body>
</html>
